<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Find Your Carrd Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #141414;
  --card-bg: #1c1c1c;
  --card-border: rgba(255,255,255,0.078);
  --white: #FFFFFF;
  --text-main: rgba(255,255,255,0.88);
  --text-muted: rgba(255,255,255,0.52);
  --blue: #1F96ED;
  --blue-hover: #3aa5f5;
  --yellow: #F7D723;
  --yellow-hover: #ffe552;
  --green: #34d399;
  --font-body: 'Inter', sans-serif;
  --font-heading: 'Sora', sans-serif;
}

body {
  background: var(--bg);
  font-family: var(--font-body);
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
}

.quiz-wrap {
  max-width: 620px;
  margin: 0 auto;
  padding: 40px 20px;
}

.progress-track {
  height: 3px;
  background: var(--card-border);
  border-radius: 2px;
  margin-bottom: 32px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--blue);
  border-radius: 2px;
  transition: width 0.4s ease;
  width: 0%;
}

.q-screen { display: none; }
.q-screen.active { display: block; animation: fadeIn 0.3s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.q-label {
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  margin-bottom: 10px;
}

.q-title {
  font-family: var(--font-heading);
  font-size: 22px;
  font-weight: 700;
  line-height: 1.35;
  color: var(--white);
  margin-bottom: 28px;
}

.options { display: flex; flex-direction: column; gap: 10px; }

.opt-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 16px 20px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 2px;
  color: var(--text-main);
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  text-align: left;
  line-height: 1.4;
}
.opt-btn:hover {
  border-color: var(--blue);
  background: rgba(31,150,237,0.06);
}
.opt-btn .opt-icon {
  font-size: 20px;
  flex-shrink: 0;
  width: 28px;
  text-align: center;
}

.back-row { margin-top: 20px; }
.back-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: var(--font-body);
  font-size: 13px;
  cursor: pointer;
  padding: 6px 0;
  transition: color 0.2s;
}
.back-btn:hover { color: var(--text-main); }

/* Result card */
.result-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 2px;
  padding: 32px 28px;
  margin-bottom: 20px;
}
.result-plan {
  font-family: var(--font-heading);
  font-size: 13px;
  font-weight: 600;
  color: var(--yellow);
  margin-bottom: 8px;
}
.result-title {
  font-family: var(--font-heading);
  font-size: 24px;
  font-weight: 700;
  color: var(--white);
  line-height: 1.3;
  margin-bottom: 14px;
}
.result-desc {
  font-size: 15px;
  line-height: 1.65;
  color: var(--text-main);
  margin-bottom: 24px;
}
.result-price {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--card-border);
}
.result-price strong {
  color: var(--white);
  font-weight: 600;
}

/* Comparison table in result */
.cmp-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 20px;
  font-size: 13px;
}
.cmp-table th {
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 12px;
  color: var(--text-muted);
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--card-border);
}
.cmp-table th.col-carrd { color: var(--blue); }
.cmp-table th.col-rival { color: var(--text-muted); }
.cmp-table td {
  padding: 9px 10px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  color: var(--text-main);
  line-height: 1.4;
  vertical-align: top;
}
.cmp-table td:first-child {
  color: var(--text-muted);
  font-weight: 500;
  white-space: nowrap;
}

/* Choose sections */
.choose-section {
  margin-bottom: 16px;
}
.choose-label {
  font-family: var(--font-heading);
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 8px;
}
.choose-label.carrd { color: var(--blue); }
.choose-label.rival { color: var(--text-muted); }
.choose-list {
  list-style: none;
  padding: 0;
}
.choose-list li {
  font-size: 14px;
  line-height: 1.55;
  color: var(--text-main);
  padding: 4px 0 4px 18px;
  position: relative;
}
.choose-list li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 11px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
.choose-section.carrd .choose-list li::before { background: var(--blue); }
.choose-section.rival .choose-list li::before { background: var(--text-muted); }

.verdict-line {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-main);
  margin-bottom: 24px;
  padding: 14px 16px;
  background: rgba(31,150,237,0.06);
  border-left: 3px solid var(--blue);
  border-radius: 0 2px 2px 0;
}

.cta-primary {
  display: inline-block;
  width: 100%;
  text-align: center;
  padding: 15px 28px;
  background: var(--yellow);
  color: #141414;
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  border-radius: 2px;
  text-decoration: none;
  transition: background 0.2s;
  margin-bottom: 12px;
}
.cta-primary:hover { background: var(--yellow-hover); }

.cta-secondary {
  display: inline-block;
  width: 100%;
  text-align: center;
  padding: 13px 28px;
  background: transparent;
  color: var(--text-muted);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  border: 1px solid var(--card-border);
  border-radius: 2px;
  text-decoration: none;
  transition: color 0.2s, border-color 0.2s;
}
.cta-secondary:hover {
  color: var(--text-main);
  border-color: rgba(255,255,255,0.2);
}

.restart-row { text-align: center; margin-top: 20px; }
.restart-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: var(--font-body);
  font-size: 13px;
  cursor: pointer;
  padding: 6px 0;
  transition: color 0.2s;
}
.restart-btn:hover { color: var(--text-main); }

@media (max-width: 480px) {
  .quiz-wrap { padding: 28px 16px; }
  .q-title { font-size: 19px; }
  .opt-btn { padding: 14px 16px; font-size: 14px; }
  .result-card { padding: 24px 20px; }
  .result-title { font-size: 20px; }
  .cmp-table { font-size: 12px; }
  .cmp-table td:first-child { white-space: normal; }
}
</style>
</head>

  // --- RESULT HELPERS ---
  function makeResult(plan, title, desc, price, pagePath, pageLabel) {
    return '<div class="result-card">'
      + '<div class="result-plan">' + plan + '</div>'
      + '<div class="result-title">' + title + '</div>'
      + '<div class="result-desc">' + desc + '</div>'
      + (price ? '<div class="result-price">' + price + '</div>' : '')
      + '<a class="cta-primary" href="' + REFERRAL + '" target="_blank" rel="noopener">Try Carrd Free</a>'
      + '<a class="cta-secondary" href="' + pagePath + '" target="_blank" rel="noopener">' + pageLabel + '</a>'
      + '</div>'
      + '<div class="restart-row"><button class="restart-btn" onclick="quiz.restart()">Start over</button></div>';
  }

  function makeVsResult(d) {

    h += '<table class="cmp-table"><thead><tr><th></th><th class="col-carrd">Carrd</th><th class="col-rival">' + d.rival + '</th></tr></thead><tbody>';
    for (var i = 0; i < d.rows.length; i++) {
      var r = d.rows[i];
      h += '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>';
    }
    h += '</tbody></table>';

    // Choose Carrd if
    h += '<div class="choose-section carrd"><div class="choose-label carrd">Choose Carrd if...</div><ul class="choose-list">';
    for (var j = 0; j < d.chooseCarrd.length; j++) {
      h += '<li>' + d.chooseCarrd[j] + '</li>';
    }
    h += '</ul></div>';

    // Choose rival if
    h += '<div class="choose-section rival"><div class="choose-label rival">Choose ' + d.rival + ' if...</div><ul class="choose-list">';
    for (var k = 0; k < d.chooseRival.length; k++) {
      h += '<li>' + d.chooseRival[k] + '</li>';
    }
    h += '</ul></div>';

    // Verdict
    h += '<div class="verdict-line">' + d.verdict + '</div>';

    // CTAs
    h += '<a class="cta-primary" href="' + REFERRAL + '" target="_blank" rel="noopener">Try Carrd Free</a>';
    h += '<a class="cta-secondary" href="' + d.page + '" target="_blank" rel="noopener">Read the full Carrd vs ' + d.rival + ' comparison</a>';
    h += '</div>';
    h += '<div class="restart-row"><button class="restart-btn" onclick="quiz.restart()">Start over</button></div>';
    return h;
  }

  var results = {

        '<strong>$19/year</strong> with custom domain',

    r_feature: function(ctx) {

    r_tricks: function() {

      ];
      var list = '<div class="result-card">'
        + '<div class="result-plan">15 Carrd tricks</div>'

    r_vs: function(ctx) {

  // --- QUIZ ENGINE ---
  var container = document.getElementById('quiz-container');
  var progressEl = document.getElementById('progress');
  var history = [];
  var ctx = {};

  function totalSteps() {
    if (history.length === 0) return 3;
    var first = history[0];
    if (!first) return 3;
    var opt = (questions.q1.options[first.idx] || {});
    var n = opt.next || '';
    if (n === 'r_tricks') return 1;
    if (n === 'q2c' || n === 'q2d' || n === 'q2e') return 2;
    return 3;
  }

  function updateProgress(step) {
    var total = totalSteps();
    var pct = Math.min(100, Math.round((step / total) * 100));
    progressEl.style.width = pct + '%';
  }

  function renderQuestion(qid) {
    var q = questions[qid];
    if (!q) return;
    var html = '<div class="q-screen active">'
      + '<div class="q-label">' + q.label + '</div>'
      + '<div class="q-title">' + q.title + '</div>'
      + '<div class="options">';
    for (var i = 0; i < q.options.length; i++) {
      var o = q.options[i];
      html += '<button class="opt-btn" data-idx="' + i + '" data-next="' + o.next + '"'
        + (o.data ? " data-ctx='" + JSON.stringify(o.data).replace(/'/g, '&#39;') + "'" : '')
        + '><span class="opt-icon">' + o.icon + '</span>' + o.text + '</button>';
    }
    html += '</div>';
    if (history.length > 0) {
      html += '<div class="back-row"><button class="back-btn" onclick="quiz.back()">\u2190 Back</button></div>';
    }
    html += '</div>';
    container.innerHTML = html;
    updateProgress(history.length);

    var btns = container.querySelectorAll('.opt-btn');
    for (var j = 0; j < btns.length; j++) {
      btns[j].addEventListener('click', function() {
        var next = this.getAttribute('data-next');
        var ctxData = this.getAttribute('data-ctx');
        if (ctxData) {
          try { var d = JSON.parse(ctxData); for (var k in d) ctx[k] = d[k]; } catch(e) {}
        }
        history.push({ qid: qid, idx: parseInt(this.getAttribute('data-idx')) });
        navigate(next);
      });
    }
  }

  function renderResult(rid) {
    var fn = results[rid];
    if (!fn) return;
    container.innerHTML = '<div class="q-screen active">' + fn(ctx) + '</div>';
    progressEl.style.width = '100%';
    if (typeof gtag === 'function') {
      gtag('event', 'quiz_complete', { result: rid, path_length: history.length });
    }
  }

  function navigate(target) {
    if (target.indexOf('r_') === 0) renderResult(target);
    else renderQuestion(target);
  }

  window.quiz = {
    restart: function() { history = []; ctx = {}; renderQuestion('q1'); },
    back: function() {
      if (history.length === 0) return;
      var prev = history.pop();
      renderQuestion(prev.qid);
    }
  };

  renderQuestion('q1');
})();
</script>
